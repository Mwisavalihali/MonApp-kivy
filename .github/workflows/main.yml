name: Creer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps: 
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les outils nécessaires (Java, Python, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev
          pip3 install --user --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Fabriquer l'APK
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug ||true

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with: 
          name: mon-application-apk
          path: | 
            * .apk
            bin/* .apk
            **/bin/*.apk
        with:
          name: MonApplication-APK
          path: bin/*.apk
